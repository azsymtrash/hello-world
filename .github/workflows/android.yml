name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CallScribe.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: callscribe-debug-apk
          path: CallScribe.apk
          if-no-files-found: error

      # Прикачва APK-то към release с постоянен таг, за да се тегли директно
      # от телефона, без вход в GitHub и без разархивиране.
      - name: Publish APK to release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Инсталируем APK за Android 8.0+. Виж README за настройката след инсталиране."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest CallScribe.apk --clobber
            gh release edit latest --prerelease=false --latest
          else
            gh release create latest CallScribe.apk \
              --title "CallScribe — последен билд" \
              --notes "$NOTES" \
              --latest
          fi
