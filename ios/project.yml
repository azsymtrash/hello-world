name: CallScribe
options:
  bundleIdPrefix: com.callscribe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  CallScribe:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.callscribe.ios
        PRODUCT_NAME: CallScribe
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/CallScribe.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: CallScribeShare
        embed: true

  CallScribeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share/Sources
      - path: App/Sources/Storage/Paths.swift
      - path: App/Sources/Storage/SharedInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.callscribe.ios.Share
        PRODUCT_NAME: CallScribeShare
        INFOPLIST_FILE: Share/Info.plist
        CODE_SIGN_ENTITLEMENTS: Share/CallScribeShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
